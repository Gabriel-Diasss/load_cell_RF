; PlatformIO Project Configuration File
;
; Este arquivo configura o ambiente de build e upload do projeto.
; O PlatformIO lê este arquivo para saber qual placa, framework e
; bibliotecas usar.
;
; Documentação: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Nome do ambiente de build. Pode-se ter múltiplos ambientes (ex: debug, release).
; Aqui usamos "esp32dev" para a placa ESP32 DevKit.

platform = espressif32
; Define o fabricante do chip: Espressif (ESP32). O PlatformIO baixa
; automaticamente o toolchain (compilador) e o SDK adequado.

board = esp32dev
; Modelo da placa. "esp32dev" é o nome genérico para uma placa de
; desenvolvimento ESP32 padrão (30 pinos, USB-serial integrado).

framework = arduino
; Framework de software que será usado. O Arduino Framework fornece funções
; conhecidas como digitalWrite(), Serial.print(), delay(), etc.,
; rodando por cima do SDK oficial da Espressif (ESP-IDF).

lib_deps =
	bogde/HX711@^0.7.5
	; Biblioteca para o conversor ADC HX711 (usado com células de carga).
	; O '^0.7.5' significa "qualquer versão 0.7.x >= 0.7.5".
	adafruit/MAX6675 library@^1.1.2
	; Biblioteca para o conversor ADC MAX6675 (usado com termopares tipo K).
	; Comunicação via SPI (SCK, CS, SO).
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	; Biblioteca para controlar display LCD 20x4 via I2C (backpack PCF8574).
	; Atualmente comentada no código, mas a dependência já está aqui para
	; quando o display físico chegar.

monitor_speed = 115200
; Velocidade (baud rate) da porta serial para comunicação com o computador.
; Deve bater com o valor passado para Serial.begin() no código.

build_flags = 
	-D RECEIVER_MAC={0xF4,0x65,0x0B,0xE5,0x9B,0x20}
	; Define uma macro do pré-processador chamada RECEIVER_MAC.
	; Isso permite configurar o endereço MAC do ESP32 que vai receber os
	; dados sem precisar mexer no código-fonte. Basta alterar esta linha.
